<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">圈选多个终端，一次关闭</title><desc id="desc">进入「批量选择」，拖框圈选或逐个点击，再统一确认关闭。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#86dfbb"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1440" height="900" rx="24" fill="#0b1017" stroke="none" /><text x="56" y="58" font-size="16" fill="#86dfbb" font-weight="650">TERMINAL+  /  03</text><text x="56" y="112" font-size="36" fill="#ecf3fa" font-weight="700">圈选多个终端，一次关闭</text><text x="56" y="150" font-size="19" fill="#91a3b9" font-weight="400">进入「批量选择」，拖框圈选或逐个点击，再统一确认关闭。</text><text x="1260" y="58" font-size="15" fill="#91a3b9" font-weight="400">交互示意</text><rect x="48" y="192" width="1344" height="586" rx="20" fill="#0e141d" stroke="#273544" /><rect x="49" y="193" width="1342" height="51" rx="19" fill="#17212e" stroke="none" /><circle cx="76" cy="218" r="6" fill="#f58080"/><circle cx="98" cy="218" r="6" fill="#f6cd7a"/><circle cx="120" cy="218" r="6" fill="#86dfbb"/><text x="644" y="224" font-size="18" fill="#ecf3fa" font-weight="650">Terminal+</text><rect x="1000" y="258" width="138" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1012" y="281" font-size="15" fill="#ecf3fa" font-weight="550">完成选择</text><rect x="1150" y="258" width="214" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1162" y="281" font-size="15" fill="#ecf3fa" font-weight="550">关闭选中 (2)</text><text x="72" y="283" font-size="17" fill="#91a3b9" font-weight="400">一个窗口，多个终端</text><rect x="72" y="311" width="638" height="204" rx="12" fill="#111a25" stroke="#86dfbb" stroke-width="2"/><rect x="73" y="312" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="88" y="339" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 01</text><text x="679" y="339" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="90" y="387" font-size="16" fill="#91a3b9" font-weight="400">demo % ▌</text><rect x="730" y="311" width="638" height="204" rx="12" fill="#111a25" stroke="#273544" /><rect x="731" y="312" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="746" y="339" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 02</text><text x="1337" y="339" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="748" y="387" font-size="16" fill="#ecf3fa" font-weight="400">demo % npm run dev</text><text x="748" y="414" font-size="16" fill="#86dfbb" font-weight="400">Ready on :3000</text><rect x="72" y="535" width="638" height="204" rx="12" fill="#111a25" stroke="#86dfbb" stroke-width="2"/><rect x="73" y="536" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="88" y="563" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 03</text><text x="679" y="563" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="90" y="611" font-size="16" fill="#91a3b9" font-weight="400">demo % ▌</text><rect x="730" y="535" width="638" height="204" rx="12" fill="#111a25" stroke="#273544" /><rect x="731" y="536" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="746" y="563" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 04</text><text x="1337" y="563" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="748" y="611" font-size="16" fill="#ecf3fa" font-weight="400">demo % tail -f app.log</text><text x="748" y="638" font-size="16" fill="#86dfbb" font-weight="400">[info] Server is running</text><rect x="86" y="356" width="607" height="366" rx="8" fill="#86dfbb" stroke="#86dfbb" fill-opacity="0.06" stroke-width="2" stroke-dasharray="7 5"/><circle cx="664" cy="337" r="12" fill="#86dfbb"/><text x="657" y="343" font-size="18" fill="#0b1017" font-weight="700">✓</text><circle cx="664" cy="561" r="12" fill="#86dfbb"/><text x="657" y="567" font-size="18" fill="#0b1017" font-weight="700">✓</text><rect x="897" y="560" width="437" height="149" rx="15" fill="#233343" stroke="#273544" /><text x="919" y="598" font-size="20" fill="#ecf3fa" font-weight="650">关闭选中的 2 个终端？</text><text x="919" y="628" font-size="16" fill="#91a3b9" font-weight="400">确认后结束所选终端中的程序。</text><rect x="1061" y="650" width="86" height="30" rx="8" fill="#35475b" stroke="none" /><text x="1086" y="671" font-size="15" fill="#ecf3fa" font-weight="400">取消</text><rect x="1157" y="650" width="154" height="30" rx="8" fill="#86dfbb" stroke="none" /><text x="1180" y="671" font-size="15" fill="#0b1017" font-weight="650">结束并关闭</text><text x="58" y="825" font-size="20" fill="#ecf3fa" font-weight="600">Shift 追加圈选  ·  ⌘A 全选  ·  Esc 完成选择</text><text x="58" y="860" font-size="17" fill="#91a3b9" font-weight="400">只关闭选中的终端，其他面板继续运行。关闭应用窗口则保留后台会话。</text></g></svg>