<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">分屏开工，各做各的</title><desc id="desc">在同一个窗口里运行服务、查看日志、执行测试。每个面板都是独立终端。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#86dfbb"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1440" height="900" rx="24" fill="#0b1017" stroke="none" /><text x="56" y="58" font-size="16" fill="#86dfbb" font-weight="650">TERMINAL+  /  01</text><text x="56" y="112" font-size="36" fill="#ecf3fa" font-weight="700">分屏开工，各做各的</text><text x="56" y="150" font-size="19" fill="#91a3b9" font-weight="400">在同一个窗口里运行服务、查看日志、执行测试。每个面板都是独立终端。</text><text x="1260" y="58" font-size="15" fill="#91a3b9" font-weight="400">交互示意</text><rect x="48" y="192" width="1344" height="586" rx="20" fill="#0e141d" stroke="#273544" /><rect x="49" y="193" width="1342" height="51" rx="19" fill="#17212e" stroke="none" /><circle cx="76" cy="218" r="6" fill="#f58080"/><circle cx="98" cy="218" r="6" fill="#f6cd7a"/><circle cx="120" cy="218" r="6" fill="#86dfbb"/><text x="644" y="224" font-size="18" fill="#ecf3fa" font-weight="650">Terminal+</text><rect x="829" y="258" width="128" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="841" y="281" font-size="15" fill="#ecf3fa" font-weight="550">＋ 新建终端</text><rect x="968" y="258" width="70" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="980" y="281" font-size="15" fill="#ecf3fa" font-weight="550">左右</text><rect x="1049" y="258" width="70" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1061" y="281" font-size="15" fill="#ecf3fa" font-weight="550">上下</text><rect x="1130" y="258" width="70" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1142" y="281" font-size="15" fill="#ecf3fa" font-weight="550">整理</text><rect x="1211" y="258" width="153" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1223" y="281" font-size="15" fill="#ecf3fa" font-weight="550">批量选择</text><text x="72" y="283" font-size="17" fill="#91a3b9" font-weight="400">一个窗口，多个终端</text><rect x="72" y="311" width="638" height="204" rx="12" fill="#111a25" stroke="#86dfbb" stroke-width="2"/><rect x="73" y="312" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="88" y="339" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 01</text><text x="679" y="339" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="90" y="387" font-size="16" fill="#ecf3fa" font-weight="400">demo % npm run dev</text><text x="90" y="414" font-size="16" fill="#86dfbb" font-weight="400">Local: http://localhost:3000</text><text x="90" y="441" font-size="16" fill="#91a3b9" font-weight="400">Ready · waiting for changes…</text><rect x="730" y="311" width="638" height="204" rx="12" fill="#111a25" stroke="#273544" /><rect x="731" y="312" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="746" y="339" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 02</text><text x="1337" y="339" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="748" y="387" font-size="16" fill="#ecf3fa" font-weight="400">demo % tail -f app.log</text><text x="748" y="414" font-size="16" fill="#86dfbb" font-weight="400">[info] GET /health  200</text><text x="748" y="441" font-size="16" fill="#91a3b9" font-weight="400">[info] Server is running</text><rect x="72" y="535" width="638" height="204" rx="12" fill="#111a25" stroke="#273544" /><rect x="73" y="536" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="88" y="563" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 03</text><text x="679" y="563" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="90" y="611" font-size="16" fill="#ecf3fa" font-weight="400">demo % swift test</text><text x="90" y="638" font-size="16" fill="#86dfbb" font-weight="400">Tests passed · 0 failures</text><text x="90" y="665" font-size="16" fill="#91a3b9" font-weight="400">demo % ▌</text><rect x="730" y="535" width="638" height="204" rx="12" fill="#111a25" stroke="#273544" /><rect x="731" y="536" width="636" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="746" y="563" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 04</text><text x="1337" y="563" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="748" y="611" font-size="16" fill="#ecf3fa" font-weight="400">demo % git status --short</text><text x="748" y="638" font-size="16" fill="#91a3b9" font-weight="400">M  README.md</text><text x="748" y="665" font-size="16" fill="#91a3b9" font-weight="400">demo % ▌</text><text x="58" y="825" font-size="20" fill="#ecf3fa" font-weight="600">⌘N 快速新建  ·  ⌘D 左右分屏  ·  ⇧⌘D 上下分屏</text><text x="58" y="860" font-size="17" fill="#91a3b9" font-weight="400">新终端继承当前目录；最多同时显示 8 个面板。「整理」一键均匀铺开。</text></g></svg>