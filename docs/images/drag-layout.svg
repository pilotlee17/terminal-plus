<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">拖到哪里，就排到哪里</title><desc id="desc">按住面板标题栏拖动，绿色区域提示放置位置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 Z" fill="#86dfbb"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,Arial,sans-serif"><rect x="0" y="0" width="1440" height="900" rx="24" fill="#0b1017" stroke="none" /><text x="56" y="58" font-size="16" fill="#86dfbb" font-weight="650">TERMINAL+  /  02</text><text x="56" y="112" font-size="36" fill="#ecf3fa" font-weight="700">拖到哪里，就排到哪里</text><text x="56" y="150" font-size="19" fill="#91a3b9" font-weight="400">按住面板标题栏拖动，绿色区域提示放置位置。</text><text x="1260" y="58" font-size="15" fill="#91a3b9" font-weight="400">交互示意</text><rect x="48" y="192" width="1344" height="586" rx="20" fill="#0e141d" stroke="#273544" /><rect x="49" y="193" width="1342" height="51" rx="19" fill="#17212e" stroke="none" /><circle cx="76" cy="218" r="6" fill="#f58080"/><circle cx="98" cy="218" r="6" fill="#f6cd7a"/><circle cx="120" cy="218" r="6" fill="#86dfbb"/><text x="644" y="224" font-size="18" fill="#ecf3fa" font-weight="650">Terminal+</text><rect x="1000" y="258" width="86" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1012" y="281" font-size="15" fill="#ecf3fa" font-weight="550">整理</text><rect x="1100" y="258" width="86" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1112" y="281" font-size="15" fill="#ecf3fa" font-weight="550">聚焦</text><rect x="1200" y="258" width="164" height="34" rx="9" fill="#1f2c3c" stroke="none" /><text x="1212" y="281" font-size="15" fill="#ecf3fa" font-weight="550">批量选择</text><text x="72" y="283" font-size="17" fill="#91a3b9" font-weight="400">一个窗口，多个终端</text><rect x="72" y="311" width="376" height="428" rx="12" fill="#111a25" stroke="#273544" /><rect x="73" y="312" width="374" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="88" y="339" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 01</text><text x="417" y="339" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="90" y="387" font-size="16" fill="#ecf3fa" font-weight="400">demo % npm run dev</text><text x="90" y="414" font-size="16" fill="#86dfbb" font-weight="400">Ready on :3000</text><rect x="472" y="311" width="896" height="428" rx="12" fill="#111a25" stroke="#273544" /><rect x="473" y="312" width="894" height="42" rx="11" fill="#1a2837" stroke="none" /><text x="488" y="339" font-size="16" fill="#ecf3fa" font-weight="650">›_  终端 02</text><text x="1337" y="339" font-size="22" fill="#91a3b9" font-weight="400">×</text><text x="490" y="387" font-size="16" fill="#ecf3fa" font-weight="400">demo % tail -f app.log</text><rect x="484" y="363" width="872" height="364" rx="10" fill="#101a24" stroke="#273544" /><rect x="1156" y="375" width="188" height="340" rx="8" fill="#173f36" stroke="#86dfbb" stroke-width="2"/><rect x="695" y="461" width="270" height="130" rx="12" fill="#213343" stroke="#273544" /><text x="757" y="512" font-size="20" fill="#ecf3fa" font-weight="650">中央：交换位置</text><text x="749" y="549" font-size="17" fill="#91a3b9" font-weight="400">保留原有运行进程</text><text x="1198" y="512" font-size="21" fill="#86dfbb" font-weight="650">放到右侧</text><text x="1185" y="549" font-size="16" fill="#86dfbb" font-weight="400">松手后重新分屏</text><text x="800" y="403" font-size="16" fill="#91a3b9" font-weight="400">上边缘</text><text x="800" y="699" font-size="16" fill="#91a3b9" font-weight="400">下边缘</text><text x="506" y="544" font-size="16" fill="#91a3b9" font-weight="400">左边缘</text><path d="M 245 336 C 550 280, 1130 300, 1232 450" fill="none" stroke="#86dfbb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="80" y="319" width="356" height="28" rx="7" fill="none" stroke="#86dfbb" stroke-width="2"/><text x="58" y="825" font-size="20" fill="#ecf3fa" font-weight="600">中央交换  ·  边缘分屏  ·  Esc 取消</text><text x="58" y="860" font-size="17" fill="#91a3b9" font-weight="400">拖错了？按 ⌥⌘Z 撤销布局调整。双击标题栏可聚焦，再次双击还原。</text></g></svg>